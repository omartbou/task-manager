<div class="dashboard-container">
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-content">
      <div class="logo">TaskFlow</div>
      <div class="user-section">
        <span class="username">Welcome, {{ currentUser?.username }}</span>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="content">
    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-title">Total Tasks</span>
          <div class="stat-icon total">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
          </div>
        </div>
        <div class="stat-value">{{ stats.total }}</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-title">Completed</span>
          <div class="stat-icon completed">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>
        <div class="stat-value">{{ stats.completed }}</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-title">Pending</span>
          <div class="stat-icon pending">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
        </div>
        <div class="stat-value">{{ stats.pending }}</div>
      </div>
    </div>

    <!-- Tasks Section -->
    <div class="tasks-section">
      <div class="tasks-header">
        <h2>My Tasks</h2>
        <button class="new-task-btn" routerLink="/tasks/new">+ New Task</button>
      </div>

      <!-- Loading State -->
      <div *ngIf="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading your tasks...</p>
      </div>

      <!-- Error State -->
      <div *ngIf="!loading && errorMessage" class="error-state">
        <p>{{ errorMessage }}</p>
        <button class="retry-btn" (click)="loadTasks()">Retry</button>
      </div>

      <!-- Empty State -->
      <div *ngIf="!loading && !errorMessage && tasks.length === 0" class="empty-state">
        <p>No tasks yet. Create your first task!</p>
        <button class="new-task-btn" routerLink="/tasks/new" style="margin-top: 1rem;">Create Task</button>
      </div>

      <!-- Tasks Table -->
      <div *ngIf="!loading && !errorMessage && tasks.length > 0" class="tasks-table">
        <table>
          <thead>
          <tr>
            <th>Status</th>
            <th>Task</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let task of tasks">
            <td class="status-cell">
              <input
                type="checkbox"
                [checked]="task.completed"
                (change)="toggleComplete(task)"
                class="task-checkbox"
              >
            </td>
            <td class="task-cell">
              <div class="task-title" [class.completed]="task.completed">
                {{ task.title }}
              </div>
              <div class="task-description" *ngIf="task.description">
                {{ task.description }}
              </div>
            </td>
            <td class="actions">
              <button class="edit" [routerLink]="['/tasks', task.id, 'edit']">Edit</button>
              <button class="delete" (click)="deleteTask(task.id)">Delete</button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
